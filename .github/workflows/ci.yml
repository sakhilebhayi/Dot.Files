# R-25: the quality gate this repo never had — deploys were manual with no test run anywhere.
# Tests are pinned to in-memory sqlite by phpunit.xml, so CI needs no database service.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: files-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (changed files must be clean)
        run: vendor/bin/pint --test --dirty || vendor/bin/pint --test

      - name: Run the suite
        run: php artisan test --compact

      # EA-1: no release carries a known-vulnerable PHP package. Any advisory fails the run, whatever its severity
      # label (many arrive unrated); a reviewed exception belongs in composer.json config.audit.ignore with a reason.
      - name: Composer audit
        run: composer audit --locked --no-interaction

      # The shipped JavaScript dependencies only (build tooling is not served); high or critical fails the run.
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
