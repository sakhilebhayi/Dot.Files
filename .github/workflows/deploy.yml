name: Deploy to Production

# Manual-only, mirroring the other Dot apps on this host: trigger from the
# Actions tab (or `gh workflow run deploy.yml -f confirm=deploy`) when a
# release is ready. Requires the DEPLOY_* repository secrets and a tree
# already adopted by adopt.yml. Dot.Files has no scheduled commands, so
# this deploy never touches the account's shared crontab.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm deploying main to production'
        required: true

concurrency:
  group: files-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to files.infodot.co.za
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Refuse unconfirmed runs
        if: ${{ github.event.inputs.confirm != 'deploy' }}
        run: |
          echo '::error::Confirmation input was not "deploy" -- aborting.'
          exit 1

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}" \
              'bash -s' <<'DEPLOY'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          PHP=php
          DOCROOT="$(dirname "$DEPLOY_PATH")"

          if [ ! -d .git ]; then
            echo "::error::$DEPLOY_PATH is not a git checkout yet -- run adopt.yml first."; exit 1
          fi

          echo "== Current release: $(git rev-parse --short HEAD)"

          git fetch origin main

          # Maintenance mode only for the risky window (migrations).
          $PHP artisan down --retry=30 || true

          git reset --hard origin/main

          # ---- application folder guard (tolerant: it cannot fail the deploy)
          # $DEPLOY_PATH sits inside the docroot (~/<host>/<key>), so without a deny file the web
          # server may hand out its database, logs and vendor/ (found 2026-10-20 on four sister
          # platforms). Same rules as app-folder-guard.yml "apply". This repo TRACKS a root .htaccess,
          # so `git reset --hard` above rewrites it on every deploy: the guard is therefore written
          # AFTER the reset (code in place), not before `artisan down`. The block is wrapped in
          # set +e with `||` fallbacks and has no command that can hang, so it cannot fail the run
          # or leave the site down; `artisan up` still follows below.
          set +e
          GUARD_HT="$DEPLOY_PATH/.htaccess"
          GUARD_PARENT="$(cd "$(dirname "$DEPLOY_PATH")" 2>/dev/null && pwd -P)" || GUARD_PARENT=""
          if [ -z "$GUARD_PARENT" ] || [ "$GUARD_PARENT" = "$(cd "${HOME:-/nonexistent}" 2>/dev/null && pwd -P)" ]; then
            echo "== app-folder guard: skipped (the app folder is not inside a docroot; a deny file there would block the whole site)"
          elif [ -f "$GUARD_HT" ] && grep -q 'Require all denied' "$GUARD_HT"; then
            echo "== app-folder guard: already present"
          elif [ -f "$GUARD_HT" ]; then
            cp "$GUARD_HT" "$GUARD_HT.before-guard" && printf '\n# Dot: the application folder is never served.\nRequire all denied\n' >> "$GUARD_HT" && echo "== app-folder guard: appended (original kept as .htaccess.before-guard)" || echo "::warning::app-folder guard: could not append to the app folder .htaccess; continuing"
          else
            printf '# Dot: the application folder is never served.\nRequire all denied\n' > "$GUARD_HT" && echo "== app-folder guard: written (new file)" || echo "::warning::app-folder guard: could not write the app folder .htaccess; continuing"
          fi
          set -e

          # Production invariant (ecosystem audit 2026-10-17, defect D9): with
          # APP_DEBUG=true any error, even a harmless 405, answers every
          # visitor with a ~840 KB debug page (source, stack frames, server
          # paths). Force it off on every deploy, BEFORE the config cache is
          # built, so a hand-edited .env cannot quietly put it back.
          if [ -f .env ]; then
            if grep -q '^APP_DEBUG=' .env; then
              sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
            else
              printf '\nAPP_DEBUG=false\n' >> .env
            fi
            echo "== APP_DEBUG forced to false: $(grep '^APP_DEBUG=' .env | tail -1)"
          fi
          composer install --no-interaction --optimize-autoloader --no-dev

          # Built frontend assets are COMMITTED in public/build -- no npm.
          $PHP artisan migrate --force

          # Caches are rebuilt here so every cached path is the host's own
          # (a cache shipped from another machine is what broke /up before).
          $PHP artisan optimize:clear
          $PHP artisan config:cache
          $PHP artisan route:cache
          $PHP artisan view:cache
          $PHP artisan event:cache

          APP_DIR="$(basename "$DEPLOY_PATH")"
          if [ "$DOCROOT" != "$DEPLOY_PATH" ] && grep -qs "$APP_DIR/vendor/autoload.php" "$DOCROOT/index.php"; then
            for target in build images img css js favicon.ico favicon-16x16.png favicon-32x32.png apple-touch-icon.png robots.txt; do
              [ -e "$DEPLOY_PATH/public/$target" ] || continue
              # A real file or folder already there (old hand-copied assets) is left alone:
              # ln would put the link INSIDE a folder instead of replacing it.
              if [ -e "$DOCROOT/$target" ] && [ ! -L "$DOCROOT/$target" ]; then
                echo "== docroot/$target is a real file or folder; left alone"; continue
              fi
              ln -sfn "$APP_DIR/public/$target" "$DOCROOT/$target"
            done
            echo "== Docroot asset links refreshed in $DOCROOT"
          fi

          $PHP artisan up

          # The page is unusable without its stylesheet and script: check the built
          # assets are really served from the public folder, not only that /up is 200.
          for asset in $($PHP -r '$m = json_decode(file_get_contents("public/build/manifest.json"), true); foreach ($m as $e) { if (! empty($e["isEntry"])) { echo $e["file"], "\n"; } }'); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://files.infodot.co.za/build/$asset" || true)
            if [ "$code" != "200" ]; then
              echo "::error::/build/$asset answered ${code:-no response} (expected 200): the docroot is not serving the built assets."; exit 1
            fi
            echo "== asset ok: /build/$asset"
          done
          echo "== Deployed: $(git rev-parse --short HEAD)"
          DEPLOY

      - name: Health check
        run: |
          sleep 3
          body="$(mktemp)"
          code=$(curl -s -o "$body" -w '%{http_code}' --max-time 20 https://files.infodot.co.za/up)
          echo "GET /up -> $code"
          # No debug page: POST to a GET-only route is a harmless 405.
          pbody="$(mktemp)"
          curl -s --max-time 20 -o "$pbody" -X POST https://files.infodot.co.za/up || true
          if grep -qiE 'vendor/laravel|stack trace' "$pbody"; then
            echo "::error::POST /up answered with a debug error page ($(wc -c < "$pbody" | tr -d ' ') bytes): APP_DEBUG is still on."
            exit 1
          fi
          if [ "$code" != "200" ] || grep -qiE 'exception|stack trace' "$body"; then
            echo "::error::/up is not a clean 200 after deploy. The site may be in maintenance mode or the release is unhealthy -- inspect with server-logs.yml, then re-run or revert."
            exit 1
          fi

      - name: Failure notice
        if: failure()
        run: |
          echo '::error::Deploy failed. If it failed during or after migrations, the site may have been left in maintenance mode intentionally -- inspect the server before running `php artisan up`.'

      - name: Probe the application folder from outside
        # Public requests only (no SSH, nothing is read): the app folder next to the docroot
        # must answer 403/404 (or a 301/302 to the login), never 200. Found 2026-10-20
        # serving its database, logs and vendor/ on four platforms. Runs after the site is
        # live again, so it can only turn the run red. Only status codes are printed.
        env:
          SITE_URL: https://files.infodot.co.za
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          KEY="$(basename "$DEPLOY_PATH")"
          [ -n "$KEY" ] && [ "$KEY" != "/" ] || { echo "::error::cannot work out the app folder name; the probe did not run"; exit 1; }
          EXPOSED=0
          UNREACHED=0
          for P in .env .env.bak-secrets artisan composer.json composer.lock database/database.sqlite storage/logs/laravel.log vendor/autoload.php phpunit.xml; do
            CODE=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$SITE_URL/$KEY/$P" || true)
            case "$CODE" in
              200) echo "::error::EXPOSED /$KEY/$P answered 200"; EXPOSED=1 ;;
              000) echo "000 /$KEY/$P (no answer)"; UNREACHED=$((UNREACHED + 1)) ;;
              *) echo "$CODE /$KEY/$P" ;;
            esac
          done
          [ "$UNREACHED" -eq 0 ] || echo "::warning::$UNREACHED probe request(s) got no answer; those paths are unverified."
          if [ "$EXPOSED" -ne 0 ]; then
            echo "::error::The application folder is readable over HTTP (database, logs or vendor/ may be downloadable). Run the App Folder Guard workflow in InfoDot (mode apply) or add the deny file by hand, then re-run."
            exit 1
          fi
          echo "== App-folder probe: no sensitive path answered 200 ($((9 - UNREACHED)) of 9 paths verified)."
